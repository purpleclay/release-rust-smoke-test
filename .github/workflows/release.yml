name: release
on:
  push:
    tags: ["*.*.*"]

permissions: {}

jobs:
  release:
    permissions:
      id-token: write # OIDC identity for Sigstore signing
      attestations: write # persist attestations
      contents: write # create the release, upload assets
    # TEMPORARY: pointed at the branch under test (purpleclay/release-workflows#98,
    # verifying every attestation before publishing) rather
    # than a pinned SHA. Revert to a pinned SHA if this repo is kept.
    uses: purpleclay/release-workflows/.github/workflows/release-rust.yml@98-verify-every-attestation
    with:
      bin: release-note
      targets: '["x86_64-unknown-linux-musl","aarch64-unknown-linux-musl","x86_64-apple-darwin","aarch64-apple-darwin"]'
      # Keep in sync with the rustToolchain pin in flake.nix
      # TEMPORARY: from a repo variable, to check build-inputs records the resolved value
      toolchain: ${{ vars.RUST_TOOLCHAIN }}
