name: release
on:
  push:
    tags: ["*.*.*"]

permissions: {}

jobs:
  release:
    permissions:
      id-token: write # OIDC identity for Sigstore signing
      attestations: write # persist attestations
      contents: write # create the release, upload assets
    # TEMPORARY: pointed at the branch under test (purpleclay/release-workflows#99,
    # binding attestations to the artifact IDs each build leg reports) rather
    # than a pinned SHA. Revert to a pinned SHA if this repo is kept.
    uses: purpleclay/release-workflows/.github/workflows/release-rust.yml@99-bind-attest-to-exact-artifacts
    with:
      bin: release-note
      targets: '["x86_64-unknown-linux-musl","aarch64-unknown-linux-musl","x86_64-apple-darwin","aarch64-apple-darwin"]'
      # Keep in sync with the rustToolchain pin in flake.nix
      toolchain: "1.90.0"
