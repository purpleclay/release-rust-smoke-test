name: release
on:
  push:
    tags: ["*.*.*"]

permissions: {}

jobs:
  release:
    permissions:
      id-token: write # OIDC identity for Sigstore signing
      attestations: write # persist attestations
      contents: write # create the release, upload assets
      actions: read # list this run's artifacts to resolve their immutable ids
    # TEMPORARY: pointed at the branch under test (purpleclay/release-workflows#23,
    # block-mode egress) rather than a released version, to smoke-test it against
    # a real run before merging. Revert to a pinned SHA if this repo is kept.
    uses: purpleclay/release-workflows/.github/workflows/release-rust.yml@23-switch-egress-policy-to-block
    with:
      bin: release-note
      targets: '["x86_64-unknown-linux-musl","aarch64-unknown-linux-musl","x86_64-apple-darwin","aarch64-apple-darwin"]'
      # Keep in sync with the rustToolchain pin in flake.nix
      toolchain: "1.90.0"
