name: release
on:
  push:
    tags: ["*.*.*"]

permissions: {}

jobs:
  release:
    permissions:
      id-token: write # OIDC identity for Sigstore signing
      attestations: write # persist attestations
      contents: write # create the release, upload assets
      actions: read # list this run's artifacts to resolve their immutable ids
    # TEMPORARY: pointed at a spike branch (purpleclay/release-workflows#70,
    # 70-rust-audit-spike) with build's/attest_sbom's harden_runner back to
    # audit, to capture real egress for cargo-auditable + Syft before
    # locking in the block-mode allowlist. Not a real config, revert once
    # the spike is done.
    uses: purpleclay/release-workflows/.github/workflows/release-rust.yml@70-rust-audit-spike
    with:
      bin: release-note
      targets: '["x86_64-unknown-linux-musl","aarch64-unknown-linux-musl","x86_64-apple-darwin","aarch64-apple-darwin"]'
      # Keep in sync with the rustToolchain pin in flake.nix
      toolchain: "1.90.0"
